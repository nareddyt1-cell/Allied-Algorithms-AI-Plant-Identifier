services:
  - type: web
    name: allied-algorithms-plant-identifier
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PLANTNET_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: /var/data/consent.db
    disk:
      name: plant-identifier-data
      mountPath: /var/data
      sizeGB: 1
